# Throwaway helper for testing the ZUGFeRD branch on a real deployment
# (Portainer): builds the production image from this branch and pushes it to
# GHCR. Lives only on ci/zugferd-image — not part of the feature PR.
name: Branch Image

on:
  push:
    branches: [ci/zugferd-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/0xshinrai/invoiceshelf:zugferd
